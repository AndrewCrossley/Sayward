name: Verify and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --group windows-build
      - run: uv run --no-sync python -m pytest tests -q
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Save installer as a draft release for qualification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          gh release create $tag dist/installer/*.exe --draft --target $env:GITHUB_SHA --title "Sayward Windows candidate $tag" --notes "Automated installer build from $env:GITHUB_SHA. Draft only: native qualification is required before release."
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run --no-sync python -m pytest tests -q
