[project]
name = "sayward"
version = "0.3.0"
description = "Private mouse-toggle local dictation for Windows and Linux X11"
requires-python = ">=3.12"
dependencies = [
  "faster-whisper==1.2.1",
  # PyAV 19 removed metadata_errors; faster-whisper 1.2.1 still passes it.
  "av==16.0.1",
  "numpy>=2,<3",
  "sounddevice==0.5.2",
  "onnxruntime>=1.20,<2",
  "tokenizers>=0.21,<1",
  "certifi>=2025",
  "python-xlib==0.33; sys_platform == 'linux'",
  "pystray==0.19.5; sys_platform == 'win32'",
  "Pillow>=11,<13; sys_platform == 'win32'",
]

[project.optional-dependencies]
gpu = ["nvidia-cublas-cu12>=12,<13; sys_platform == 'linux'", "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest>=8,<10"]
windows-build = ["pyinstaller>=6.16,<7; sys_platform == 'win32'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
